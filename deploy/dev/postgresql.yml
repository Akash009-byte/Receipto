name: receipto
services:
  postgresql:
    image: postgres:15.2
    volumes:
      - /var/lib/receipto_pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=receipto
      - POSTGRES_PASSWORD=receipto$123
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U receipto']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432