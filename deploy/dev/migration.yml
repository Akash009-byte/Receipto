name: receipto
services:
  migrate:
    image: ghcr.io/raxkumar/receipto
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - POSTGRESQL_DB_URL=postgresql+asyncpg://receipto:receipto$123@postgresql:5432/receipto
    working_dir: /app
    command: >
      bash -c "
        cd app &&
        alembic upgrade head
      "
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql

